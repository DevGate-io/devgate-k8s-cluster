apiVersion: apps/v1
kind: Deployment
metadata:
  name: devgate-frontend
  namespace: devgate
  labels:
    app: devgate-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devgate-frontend
  template:
    metadata:
      labels:
        app: devgate-frontend
    spec:
      containers:
        - name: frontend
          image: devgate/frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            # Runtime-значение для SSR/BFF-роутов внутри кластера.
            # В клиентском бандле остаётся значение, заданное при сборке образа
            # (см. k8s/images/frontend.Dockerfile).
            - name: NEXT_PUBLIC_API_URL
              value: http://gateway:80
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: devgate-frontend
  namespace: devgate
  labels:
    app: devgate-frontend
spec:
  selector:
    app: devgate-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
